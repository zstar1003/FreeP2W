[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freep2w"
version = "1.0.0"
description = "Free PDF to Word Converter"
readme = "README.md"
authors = [
    {name = "zstar", email = "zstar1003@163.com"}
]
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business",
    "Topic :: Text Processing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
keywords = ["pdf", "docx", "converter", "formula", "recognition", "yolo", "unimernet"]
dependencies = [
    "fire==0.7.1",
    "fonttools==4.60.1",
    "lxml==6.0.2",
    "opencv-python-headless==4.11.0.86",
    "python-docx==1.2.0",
    "termcolor==3.1.0",
    "typing-extensions==4.15.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "psutil>=5.9.0",
    "matplotlib>=3.5.0",
    "pandas>=2.0.0",
    "pymupdf>=1.23.0",
    "omegaconf>=2.3.0",
    "iopath>=0.1.10",
    "timm>=0.9.0",
    "albumentations>=1.3.0",
    "transformers==4.42.4",
    "fairscale>=0.4.13",
    "ftfy>=6.3.1",
    "webdataset>=1.0.2",
    "evaluate>=0.4.6",
    "rapidfuzz>=3.14.1",
    "pyinstaller>=6.16.0",
    "twine>=6.2.0",
    "build>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/zstar1003/FreeP2W"
Documentation = "https://github.com/zstar1003/FreeP2W/wiki"
Repository = "https://github.com/zstar1003/FreeP2W"
"Bug Tracker" = "https://github.com/zstar1003/FreeP2W/issues"

[project.scripts]
freep2w = "freep2w.cli:main"

[tool.setuptools]
# 包含所有必要的包（freep2w + 本地依赖模块）
packages = {find = {where = ["."], include = ["freep2w", "freep2w.*", "doclayout_yolo", "doclayout_yolo.*", "pdf2docx", "pdf2docx.*", "unimernet", "unimernet.*"]}}

[tool.setuptools.package-data]
freep2w = ["weights/*.pt", "*.yaml"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
