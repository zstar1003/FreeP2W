[project]
name = "FreeP2W"
version = "0.1.0"
description = "The best method for PDF to Word"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fire==0.7.1",
    "fonttools==4.60.1",
    "lxml==6.0.2",
    "opencv-python-headless==4.11.0.86",
    "python-docx==1.2.0",
    "termcolor==3.1.0",
    "typing-extensions==4.15.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "psutil>=7.1.1",
    "matplotlib>=3.10.7",
    "pandas>=2.3.3",
    "pymupdf>=1.26.5",
    "omegaconf>=2.3.0",
    "iopath>=0.1.10",
    "timm>=1.0.20",
    "albumentations>=2.0.8",
    "transformers==4.42.4",
    "fairscale>=0.4.13",
    "ftfy>=6.3.1",
    "webdataset>=1.0.2",
    "evaluate>=0.4.6",
    "rapidfuzz>=3.14.1",
    "pyinstaller>=6.16.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
